[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Starlette 0.37 still does `import multipart`; pending upstream rename to python_multipart
filterwarnings =
    ignore:Please use `import python_multipart` instead:PendingDeprecationWarning
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
